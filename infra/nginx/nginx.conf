# ==============================================================================
# Hardened Nginx Reverse Proxy Configuration for Custom Domain Deployment
# Placeholders: REPLACE 'app.yourpgcompany.com' WITH YOUR ACTUAL CUSTOM DOMAIN
# ==============================================================================

# HTTP: Enforce immediate redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.yourpgcompany.com yourpgcompany.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Production Hardened Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourpgcompany.com yourpgcompany.com;

    # SSL TLS Certificates (Provisioned via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/app.yourpgcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourpgcompany.com/privkey.pem;

    # Modern Cryptographic Protocols (TLS 1.2 & 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Defense-in-Depth Security Response Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:;" always;

    # Root directory for static production web build
    root /var/www/pg-management-web/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Favicon Caching
    location ~* \.(ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy Routing to Spring Boot Backend
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Web App Routing (SPA fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
