# ==============================================================================
# PG-Management-SaaS Infrastructure Stack (PostgreSQL 16 + Backend)
# Copy ../.env.example to ../.env and set strong credentials before running:
#   docker compose --env-file ../.env -f infra/docker-compose.yml up -d
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pg_management_db}
      POSTGRES_USER: ${DB_USER:-pg_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment or .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pg_admin} -d ${DB_NAME:-pg_management_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pg_management_backend
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pg_management_db}
      DB_USER: ${DB_USER:-pg_admin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment or .env}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081,http://10.0.2.2:8080}
      FIREBASE_AUTH_ENABLED: ${FIREBASE_AUTH_ENABLED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      OWNER_ALLOWLIST_PHONES: ${OWNER_ALLOWLIST_PHONES:-}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-120}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pg_network

volumes:
  pg_data:
    driver: local

networks:
  pg_network:
    driver: bridge
