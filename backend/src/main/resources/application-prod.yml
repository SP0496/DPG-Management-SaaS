# ==============================================================================
# Production Profile (application-prod.yml)
# Strict Hardening: Zero stack trace leakage, minimal logging, schema validation
# ==============================================================================

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    com.pgmanagement: INFO

management:
  endpoint:
    health:
      show-details: never
