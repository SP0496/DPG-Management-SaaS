# Hardened production profile settings
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

logging:
  level:
    root: WARN
    com.pgmanagement.saas: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
