spring:
  datasource:
    url: jdbc:h2:mem:pg_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: "dGVzdC1vbmx5LWgyLWp3dC1zaWduaW5nLWtleS02NC1ieXRlcy1taW5pbXVtLWZvci1oczUxMi10ZXN0cyEh"
    cors:
      allowed-origins: http://localhost:3000
    rate-limit:
      auth-per-minute: 500
      general-per-minute: 5000
  firebase:
    enabled: false
    owner-phones: "+919800000001,+919800000002"
